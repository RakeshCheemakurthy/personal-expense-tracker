<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{% block title %}Expense Tracker{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header><a class="brand" href="/">Expense<span>Tracker</span></a><span>Simple money tracking</span></header><main class="container">{% with msgs=get_flashed_messages(with_categories=true) %}{% for cat,msg in msgs %}<p class="flash {{ cat }}">{{ msg }}</p>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main><footer>Personal Expense Tracker · Flask + MySQL</footer></body></html>
