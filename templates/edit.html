{% extends "base.html" %}{% block title %}Edit transaction{% endblock %}{% block content %}<section class="panel"><h1>Edit transaction</h1><form method="post" class="grid"><label>Title<input name="title" required value="{{ item.title }}"></label><label>Type<select name="transaction_type"><option value="expense" {% if item.transaction_type=='expense' %}selected{% endif %}>Expense</option><option value="income" {% if item.transaction_type=='income' %}selected{% endif %}>Income</option></select></label><label>Category<select name="category">{% for c in ['Salary','Food','Travel','Shopping','Bills','Education','Health','Other'] %}<option {% if item.category==c %}selected{% endif %}>{{ c }}</option>{% endfor %}</select></label><label>Amount<input name="amount" type="number" min="0.01" step="0.01" required value="{{ item.amount }}"></label><label>Date<input name="transaction_date" type="date" required value="{{ item.transaction_date }}"></label><label class="wide">Note<input name="note" value="{{ item.note or '' }}"></label><div class="wide"><button class="button">Save changes</button> <a href="/">Cancel</a></div></form></section>{% endblock %}
